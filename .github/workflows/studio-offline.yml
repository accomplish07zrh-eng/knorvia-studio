name: Studio offline checks

# Isolated process-proof probe; never merge this branch or use it as release evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-process-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3bfe071f55d1f54285f7c0d901e34fd0cc4f99e
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install frozen TypeScript loader
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Measure existing identity helper and safe OS dependencies
        shell: bash
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import { spawn, execFile } from 'node:child_process';
          import { createServer } from 'node:net';
          import { workspaceRuntimeEnvironment } from './packages/services/src/studio-runtime/domain/workspaceRuntimeEnvironment.ts';
          import { captureProcessTreeSnapshotAsync } from './packages/services/src/process/processTreeSnapshotAsync.ts';
          const selected = workspaceRuntimeEnvironment(process.env, 'win32');
          const reservation=createServer();
          await new Promise(resolve=>reservation.listen(0,'127.0.0.1',resolve));
          const port=reservation.address().port;
          await new Promise(resolve=>reservation.close(resolve));
          const child = spawn(process.execPath, ['-e', `require('http').createServer((q,r)=>r.end('probe')).listen(${port},'127.0.0.1')`], {env:selected,stdio:'ignore'});
          await new Promise((resolve,reject)=>{child.once('spawn',resolve);child.once('error',reject)});
          const escaped = text => text.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          function record(value) {console.log('::warning title=Windows identity probe::'+escaped(JSON.stringify(value)))}
          const warnings=[];
          const log={warn(_trace,message,error){warnings.push({message,code:error?.code,killed:error?.killed,signal:error?.signal})}};
          const command="Get-CimInstance Win32_Process | ForEach-Object { '{0} {1} {2}' -f $_.ProcessId, $_.ParentProcessId, $_.CreationDate.ToUniversalTime().Ticks }";
          async function query(name,env,commandText=command,timeout=2500) {
            const start=Date.now();
            const result=await new Promise(resolve=>execFile('powershell.exe',['-NoLogo','-NoProfile','-NonInteractive','-Command',commandText],{env,encoding:'utf8',windowsHide:true,timeout},(error,stdout,stderr)=>resolve({error,stdout,stderr})));
            record({name,elapsed:Date.now()-start,code:result.error?.code,killed:result.error?.killed,signal:result.error?.signal,
              lines:result.stdout.trim().split(/\r?\n/).filter(Boolean).length,root:result.stdout.split(/\r?\n/).some(row=>Number(row.trim().split(/\s+/)[0])===child.pid),
              stderr:result.stderr.slice(0,1200)});
          }
          try {
            const wmiAll="[void][System.Reflection.Assembly]::LoadWithPartialName('System.Management'); $search=[System.Management.ManagementObjectSearcher]::new('SELECT ProcessId, ParentProcessId, CreationDate FROM Win32_Process'); try { $search.Get() | ForEach-Object { if ($_.CreationDate) { '{0} {1} {2}' -f $_.ProcessId, $_.ParentProcessId, ([System.Management.ManagementDateTimeConverter]::ToDateTime($_.CreationDate).ToUniversalTime().Ticks) } } } finally { $search.Dispose() }";
            const wmiFiltered=wmiAll.replace('FROM Win32_Process',`FROM Win32_Process WHERE ProcessId = ${child.pid}`);
            await query('direct-WMI-existing-budget',selected,wmiAll,2500);
            await query('direct-WMI-filtered-existing-budget',selected,wmiFiltered,2500);
            await query('direct-WMI-completion-duration',selected,wmiAll,10000);
            const start=Date.now();
            const result=await new Promise(resolve=>execFile('netstat.exe',['-ano','-p','TCP'],{env:selected,encoding:'utf8',windowsHide:true,timeout:1500},(error,stdout,stderr)=>resolve({error,stdout,stderr})));
            const listener=result.stdout.split(/\r?\n/).some(row=>{const fields=row.trim().split(/\s+/);return fields[0]==='TCP'&&fields[1]===`127.0.0.1:${port}`&&fields[2]==='0.0.0.0:0'&&fields[3]==='LISTENING'&&Number(fields[4])===child.pid});
            record({name:'native-netstat-existing-budget',elapsed:Date.now()-start,code:result.error?.code,killed:result.error?.killed,signal:result.error?.signal,listener,stderr:result.stderr.slice(0,1200)});
                    } finally {
            child.kill();
            if(child.exitCode===null)await new Promise(resolve=>child.once('exit',resolve));
          }
          NODE
