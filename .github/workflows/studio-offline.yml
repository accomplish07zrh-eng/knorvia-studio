name: Studio offline checks

# 本工作流只做检查，不构建安装包、不创建 Release（specs/knorvia-release-gates.md 规则 5）。
# 检查步骤只在 .github/workflows/studio-quality.yml 中定义一次（规则 1）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 每个 PR 走 Linux 快速检查；离线测试不依赖 Electron 原生模块，因此跳过安装脚本。
  # 离线检查不依赖 Electron 原生模块，跳过安装脚本可省下编译时间。
  linux:
    uses: ./.github/workflows/studio-quality.yml
    with:
      runs-on: ubuntu-latest
      install-args: "--frozen-lockfile --ignore-scripts"
      timeout-minutes: 30

  # Windows 回归在 PR 上也必须运行（规则 4）。保留 Linux 快速检查作为更早的信号。
  windows:
    uses: ./.github/workflows/studio-quality.yml
    with:
      runs-on: windows-latest
      # 与 linux 一致：离线测试不依赖 Electron / native 模块。
      # cpu-features 是 ssh2 的 optional dependency，缺失时 ssh2 走纯 JS 降级路径，
      # 离线回归不建立真实 SSH 连接，因此不需要它。
      # windows-latest 上并非每个 runner 都装了 Visual Studio：一旦跑安装脚本，
      # cpu-features 的 node-gyp 会报 `gyp ERR! find VS` 而失败，并拖垮后续全部检查步骤
      # （表现为 Offline Studio regression 失败，但根因在安装阶段）。
      install-args: "--frozen-lockfile --ignore-scripts"
      timeout-minutes: 60
