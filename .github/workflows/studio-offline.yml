name: Studio offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 每个 PR 走 Linux 快速检查；离线测试不依赖 Electron 原生模块，因此跳过安装脚本。
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck including desktop main
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture check (full repository)
        run: pnpm architecture:check
      - name: Build CLI packages used by offline tests
        run: pnpm build:cli-packages
      - name: Offline Studio regression
        run: pnpm test:studio

  # Windows 平台回归只在合入 main 后或手动触发时运行，节省 Windows 分钟数。
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck including desktop main
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture check (full repository)
        run: pnpm architecture:check
      - name: Build CLI packages used by offline tests
        run: pnpm build:cli-packages
      - name: Offline Studio regression
        run: pnpm test:studio
