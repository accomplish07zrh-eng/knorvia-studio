name: Studio offline checks

# Isolated process-proof probe; never merge this branch or use it as release evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-process-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3bfe071f55d1f54285f7c0d901e34fd0cc4f99e
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install frozen TypeScript loader
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Measure existing identity helper and safe OS dependencies
        shell: bash
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import { spawn, execFile } from 'node:child_process';
          import { workspaceRuntimeEnvironment } from './packages/services/src/studio-runtime/domain/workspaceRuntimeEnvironment.ts';
          import { captureProcessTreeSnapshotAsync } from './packages/services/src/process/processTreeSnapshotAsync.ts';
          const selected = workspaceRuntimeEnvironment(process.env, 'win32');
          const child = spawn(process.execPath, ['-e', 'setInterval(()=>{},1000)'], {env:selected,stdio:'ignore'});
          await new Promise((resolve,reject)=>{child.once('spawn',resolve);child.once('error',reject)});
          const escaped = text => text.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          function record(value) {console.log('::warning title=Windows identity probe::'+escaped(JSON.stringify(value)))}
          const warnings=[];
          const log={warn(_trace,message,error){warnings.push({message,code:error?.code,killed:error?.killed,signal:error?.signal})}};
          const command="Get-CimInstance Win32_Process | ForEach-Object { '{0} {1} {2}' -f $_.ProcessId, $_.ParentProcessId, $_.CreationDate.ToUniversalTime().Ticks }";
          async function query(name,env) {
            const start=Date.now();
            const result=await new Promise(resolve=>execFile('powershell.exe',['-NoLogo','-NoProfile','-NonInteractive','-Command',command],{env,encoding:'utf8',windowsHide:true,timeout:2500},(error,stdout,stderr)=>resolve({error,stdout,stderr})));
            record({name,elapsed:Date.now()-start,code:result.error?.code,killed:result.error?.killed,signal:result.error?.signal,
              lines:result.stdout.trim().split(/\r?\n/).filter(Boolean).length,root:result.stdout.split(/\r?\n/).some(row=>Number(row.trim().split(/\s+/)[0])===child.pid),
              stderr:result.stderr.slice(0,1200)});
          }
          try {
            const start=Date.now();
            const proof=await captureProcessTreeSnapshotAsync(child,{helperEnvironment:selected,log});
            record({name:'actual-production-helper',elapsed:Date.now()-start,identities:proof?.identities.length??0,warnings});
            await query('selected-os-projection',selected);
            const expanded={...selected};
            const safeNames=['SystemDrive','ProgramFiles','ProgramFiles(x86)','ProgramW6432','ProgramData','COMPUTERNAME','OS','PROCESSOR_ARCHITECTURE','PROCESSOR_IDENTIFIER','NUMBER_OF_PROCESSORS'];
            for(const name of safeNames){const key=Object.keys(process.env).find(key=>key.toUpperCase()===name.toUpperCase());if(key&&process.env[key])expanded[name]=process.env[key]}
            await query('explicit-extra-os-projection',expanded);
          } finally {
            child.kill();
            if(child.exitCode===null)await new Promise(resolve=>child.once('exit',resolve));
          }
          NODE
