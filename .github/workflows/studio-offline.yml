name: Studio offline checks

# 本工作流只做检查，不构建安装包、不创建 Release（specs/knorvia-release-gates.md 规则 5）。
# 检查步骤只在 .github/workflows/studio-quality.yml 中定义一次（规则 1）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 每个 PR 走 Linux 快速检查；离线测试不依赖 Electron 原生模块，因此跳过安装脚本。
  # 离线检查不依赖 Electron 原生模块，跳过安装脚本可省下编译时间。
  linux:
    uses: ./.github/workflows/studio-quality.yml
    with:
      runs-on: ubuntu-latest
      install-args: "--frozen-lockfile --ignore-scripts"
      timeout-minutes: 30

  # Windows 回归在 PR 上也必须运行（规则 4）。保留 Linux 快速检查作为更早的信号。
  windows:
    uses: ./.github/workflows/studio-quality.yml
    with:
      runs-on: windows-latest
      install-args: "--frozen-lockfile"
      timeout-minutes: 60
