name: Studio offline checks

# Temporary isolated diagnosis. This branch must never be merged or released.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-focused:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3bfe071f55d1f54285f7c0d901e34fd0cc4f99e
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI dependencies for the actual provider path
        run: pnpm build:cli-packages
      - name: Diagnose new Windows cases without log-download access
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const tests = [
            'studio-workspace-runtime-environment.test.ts',
            'studio-workspace-runtime-health.test.ts',
            'studio-workspace-runtime.test.ts',
            'studio-workspace-runtime-recovery.test.ts',
            'studio-workspace-runtime-helper-env.test.ts',
            'process-helper-environment.test.ts',
            'studio-integrated-runtime.test.ts',
          ];
          const data = await mkdtemp(join(tmpdir(), 'knorvia-focused-windows-'));
          const env = { ...process.env, KNORVIA_ENV: 'test', KNORVIA_DATA_BASE_DIR: data,
            KNORVIA_STORAGE_DIR: join(data, 'cli'),
            TSX_TSCONFIG_PATH: resolve('packages/ui/tsconfig.json') };
          for (const key of Object.keys(env)) {
            if (/(?:API[_-]?KEY|ACCESS[_-]?TOKEN|AUTH[_-]?TOKEN|SECRET|PASSWORD|_KEY)$|^GH_TOKEN$/iu.test(key)) delete env[key];
          }
          const escaped = text => text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          let failures = 0;
          try {
            for (const name of tests) {
              const path = 'packages/services/test/' + name;
              let output = '';
              const child = spawn(process.execPath, ['--experimental-test-module-mocks', '--import', 'tsx',
                '--test', '--test-reporter=tap', '--test-timeout=120000', path],
                { env, stdio: ['ignore', 'pipe', 'pipe'] });
              child.stdout.on('data', chunk => { output += chunk; });
              child.stderr.on('data', chunk => { output += chunk; });
              const code = await new Promise((done, reject) => {
                child.once('error', reject); child.once('exit', done);
              });
              console.log(name + ': exit ' + code);
              if (code === 0) continue;
              failures++;
              const lines = output.split(/\r?\n/);
              const indexes = lines.flatMap((line, index) => /^\s*not ok \d+/.test(line) ? [index] : []);
              if (!indexes.length) console.log('::error title=Focused Windows regression::' + escaped(path + '\n' + output.slice(-6000)));
              for (const index of indexes.slice(0, 12)) {
                console.log('::error title=Focused Windows regression::' + escaped(path + '\n' + lines.slice(index, index + 75).join('\n').slice(0, 6000)));
              }
            }
          } finally { await rm(data, { recursive: true, force: true }); }
          if (failures) process.exitCode = 1;
          NODE
