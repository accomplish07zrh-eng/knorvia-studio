name: Release Windows portable

# 手动触发：先在 Windows 上跑完全部质量检查，再打包便携版并发布到 GitHub Release。
# Release 标签取根 package.json 的版本（v<version>），含 preview 的版本标为预发布。
# 同版本内容不可变：不使用 --clobber，不删除标签/Release/附件（specs/knorvia-release-gates.md）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的提交 SHA 或 ref；留空表示使用当前触发提交
        required: false
        type: string
        default: ""
      dry_run:
        description: 只检查并打包、校验不可变性，不创建或上传 Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  # 检查与打包绑定同一 SHA：打包只使用 quality 输出的受检 SHA。
  # 检查失败/取消时 needs 会阻断后续 job，因此不可能发布未验证的提交（规则 3）。
  quality:
    uses: ./.github/workflows/studio-quality.yml
    with:
      ref: ${{ inputs.ref }}
      runs-on: windows-latest
      install-args: "--frozen-lockfile"
      timeout-minutes: 90

  package:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      KNORVIA_ENV: production
      KNORVIA_PORTABLE_BUILD: "1"
      # 桌面安装包不依赖 remote 资产（见 prepare-runtime-assets.mjs）。
      KNORVIA_SKIP_REMOTE_ASSETS: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact-name: ${{ steps.zip.outputs.name }}
      artifact-sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.checked-sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm delivered SHA
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $checked = "${{ needs.quality.outputs.checked-sha }}"
          if ($head -ne $checked) { throw "打包提交 $head 与受检提交 $checked 不一致" }
          "DELIVERED_SHA=$head" >> $env:GITHUB_ENV
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows x64 package
        run: node packages/desktop/scripts/bundle.mjs --os win --arch x64
      - name: Package portable zip
        id: zip
        shell: pwsh
        run: |
          $unpacked = "packages/desktop/dist/win-unpacked"
          if (-not (Test-Path "$unpacked/resources/knorvia-portable.json")) { throw "Portable marker missing" }
          $stage = "release-stage/Knorvia Studio Portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "$unpacked/*" $stage
          $name = "Knorvia-Studio-${{ steps.version.outputs.version }}-win-x64-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $name -CompressionLevel Optimal
          $zipSha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$zipSha  $name" | Out-File -Encoding ascii "$name.sha256"
          $sumName = "$name.sha256"
          $sumSha = (Get-FileHash $sumName -Algorithm SHA256).Hash.ToLower()
          @(
            @{ name = $name; sha256 = $zipSha },
            @{ name = $sumName; sha256 = $sumSha }
          ) | ConvertTo-Json | Out-File -Encoding utf8 release-artifacts.json
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$zipSha" >> $env:GITHUB_OUTPUT
          {
            echo "## 打包产物"
            echo ""
            echo "- 交付 SHA：\`$env:DELIVERED_SHA\`"
            echo "- 产物：\`$name\`"
            echo "- SHA-256：\`$zipSha\`"
          } >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: knorvia-windows-portable
          path: |
            *.zip
            *.zip.sha256
            release-artifacts.json
          if-no-files-found: error
  # 只读的发布校验：标签查询与同版本不可变判定**普通发布与 dry run 都要跑**。
  # 这里刻意只申请 contents: read —— 本 job 不创建、不上传、不删除任何东西。
  validate-release:
    needs: [quality, package]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      action: ${{ steps.decide.outputs.action }}
      to-upload: ${{ steps.decide.outputs.to-upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.checked-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          name: knorvia-windows-portable

      - name: Resolve tag and release state
        id: state
        shell: pwsh
        run: |
          $tag = "${{ needs.package.outputs.tag }}"
          $sha = "${{ needs.quality.outputs.checked-sha }}"
          git fetch --tags --force | Out-Null

          $tagExists = "false"
          $tagSha = ""
          git rev-parse --verify --quiet "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = "true"
            $tagSha = (git rev-parse "$tag^{commit}").Trim()
          }

          # 必须区分“Release 不存在”和“查询失败”；查询失败不能按不存在继续创建。
          $state = "unknown"
          gh release view $tag --json tagName,assets 2> release-view.err > release-existing.json
          if ($LASTEXITCODE -eq 0) {
            $state = "exists"
          } else {
            $err = (Get-Content release-view.err -Raw -ErrorAction SilentlyContinue)
            Write-Host "gh release view 退出码 $LASTEXITCODE：$err"
            if ($err -match "not found|HTTP 404") { $state = "missing" }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "tag-exists=$tagExists" >> $env:GITHUB_OUTPUT
          "tag-sha=$tagSha" >> $env:GITHUB_OUTPUT
          "release-state=$state" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag tagExists=$tagExists tagSha=$tagSha releaseState=$state"

      - name: Decide immutability action
        id: decide
        shell: pwsh
        run: |
          $args = @(
            "scripts/release-immutability.mjs",
            "--tag", "${{ steps.state.outputs.tag }}",
            "--sha", "${{ steps.state.outputs.sha }}",
            "--tag-exists", "${{ steps.state.outputs.tag-exists }}",
            "--tag-sha", "${{ steps.state.outputs.tag-sha }}",
            "--release-state", "${{ steps.state.outputs.release-state }}",
            "--artifacts-json", "release-artifacts.json",
            "--out", "release-decision.json"
          )
          if ("${{ steps.state.outputs.release-state }}" -eq "exists") {
            $args += @("--existing-json", "release-existing.json")
          }
          node @args
          $code = $LASTEXITCODE
          $decision = Get-Content release-decision.json -Raw | ConvertFrom-Json
          "action=$($decision.action)" >> $env:GITHUB_OUTPUT
          "to-upload=$($decision.toUpload -join ',')" >> $env:GITHUB_OUTPUT
          {
            echo "## 同版本不可变判定（只读校验）"
            echo ""
            echo "- 标签：\`${{ steps.state.outputs.tag }}\`"
            echo "- 结论：\`$($decision.action)\`（$($decision.reason)）"
            echo "- 说明：$($decision.message)"
            echo "- 本次触发：\`${{ inputs.dry_run && 'dry run（只校验，不发布）' || '正式发布' }}\`"
          } >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "拒绝发布：$($decision.message)" }

      - uses: actions/upload-artifact@v4
        with:
          name: knorvia-release-decision
          path: |
            release-decision.json
            release-existing.json
          if-no-files-found: warn

  publish:
    needs: [quality, package, validate-release]
    # 只有创建 Release、上传附件这类**写**操作才受 dry_run 控制；
    # 标签查询与不可变判定已经在上面的只读 job 里对两种触发都跑过了。
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.checked-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          name: knorvia-windows-portable

      - name: Create release
        if: ${{ needs.validate-release.outputs.action == 'create' }}
        shell: pwsh
        run: |
          $tag = "${{ needs.package.outputs.tag }}"
          $version = "${{ needs.package.outputs.version }}"
          $sha = "${{ needs.quality.outputs.checked-sha }}"
          $prerelease = if ($version -match "preview|dev|beta|alpha") { "--prerelease" } else { "" }
          gh release create $tag --target $sha --title "Knorvia Studio $tag" --notes "Windows x64 便携版：解压后直接运行 Knorvia Studio.exe，数据保存在程序旁的 data 目录。构建提交 $sha。产物 SHA-256 见同名 .sha256 附件。" $prerelease
          gh release upload $tag "${{ needs.package.outputs.artifact-name }}" "${{ needs.package.outputs.artifact-name }}.sha256"

      - name: Upload missing assets
        if: ${{ needs.validate-release.outputs.action == 'upload' }}
        shell: pwsh
        run: |
          $tag = "${{ needs.package.outputs.tag }}"
          $names = "${{ needs.validate-release.outputs.to-upload }}".Split(",") | Where-Object { $_ }
          # 不使用 --clobber：只补传缺失附件，绝不覆盖已发布字节。
          gh release upload $tag @names

      - name: Idempotent finish
        if: ${{ needs.validate-release.outputs.action == 'skip' }}
        shell: pwsh
        run: |
          Write-Host "同版本已发布相同字节：${{ needs.package.outputs.artifact-name }} (${{ needs.package.outputs.artifact-sha256 }})"
          Write-Host "幂等结束，不覆盖、不删除任何已发布内容。"
